      <!-- 维护弹窗开关：true=开启 false=关闭 -->
  <script>const enableMaintenance = false;</script>
  <style>
    .maintenance-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:999999;font-family:"Microsoft YaHei",sans-serif;}
    .maintenance-box{text-align:center;padding:40px 20px;background:#fff;border-radius:16px;max-width:500px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,0.2);}
    .maintenance-icon{font-size:60px;margin-bottom:20px;}
    .maintenance-box h1{font-size:26px;margin-bottom:15px;color:#2c3e50;}
    .maintenance-tip{font-size:16px;color:#7f8c8d;line-height:1.8;margin-bottom:20px;}
    .maintenance-notice{font-size:14px;color:#e74c3c;}
  </style>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      if(enableMaintenance){
        const maintenanceHTML=`<div class="maintenance-overlay"><div class="maintenance-box"><div class="maintenance-icon">🚧</div><h1>系统正在维护中</h1><p class="maintenance-tip">服务器正在进行例行维护升级，网站暂时无法访问。<br>我们正在加急处理，将尽快恢复服务
        </p><p class="maintenance-notice">您可以稍后再尝试访问，感谢您的耐心等待。</p></div></div>`;
        document.body.insertAdjacentHTML('afterbegin',maintenanceHTML);
      }
    });
  </script>
